<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 색상·글꼴·모서리는 여기(:root)에서 한 번에 바꿀 수 있어요 (Habitz 디자인 시스템 기준) ===== */
:root{
  /* 기본 */
  --surface:#fdfdfd;          /* 화면 바탕 */
  --field:#f4f4f6;            /* 입력칸·카드·탭바 회색 면 */
  --ink:#111111;              /* 글자 */
  --ink2:#6b6b6b;            /* 보조 글자 */
  --ink3:#c7c7c7;            /* 흐린 글자(읽을 필요 없는 곳에만) */
  /* 행동: 누를 곳은 보라색 */
  --primary:#7635c5;
  --primary-soft:#b28ddd;     /* 응원 카드 그라데이션 시작 */
  --primary-soft-end:#a271da; /* 응원 카드 그라데이션 끝 */
  --sel:#fbf5ff;              /* 선택된 날짜·칩 배경 */
  /* 캐릭터 색 = 일정 색 */
  --pink:#f28eb4; --yellow:#f9a81b; --coral:#f37350; --teal:#37c6c2; --blue:#7291d1;
  --c1:var(--pink); --c2:var(--yellow); --c3:var(--teal); --c4:var(--blue);   /* 일정 4색 */
  --danger:#c2452a;           /* 코랄을 진하게 한 색(글자 대비용) */
  /* 글꼴과 모서리 */
  --font:'Inter','Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --r-sm:6px; --r-md:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font);font-size:15px;font-weight:400;line-height:1.5;padding-bottom:120px}
h1,h2,h3{font-family:var(--font);margin:0;font-weight:500}
button{font-family:inherit;cursor:pointer}
header{background:var(--surface);position:sticky;top:0;z-index:5;padding:12px 24px}
.top{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:-.04em;color:var(--primary)}
.logo small{font-size:12px;color:var(--ink2);font-weight:400;letter-spacing:0}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;color:var(--ink2);padding:8px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--sel);color:var(--primary);font-weight:600}
main{max-width:960px;margin:0 auto;padding:8px 24px 24px}
.card{margin-bottom:24px}
.card h3{font-size:18px;margin-bottom:12px}
.sub{color:var(--ink2);font-size:12px}
.chr{flex:none;display:block}

/* 주간 날짜 띠 */
.weekbar{background:var(--field);border-radius:var(--r-md);padding:12px;margin-bottom:24px}
.weekhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.weekhead h2{font-size:20px}
.arrow{border:0;background:transparent;color:var(--primary);width:32px;height:32px;font-size:22px;line-height:1;border-radius:50%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{border:0;background:transparent;border-radius:var(--r-md);padding:8px 0;color:var(--ink2);font-size:11px}
.wd b{display:block;font-size:15px;margin-top:2px;color:var(--ink);font-weight:500}
.wd.on{background:var(--sel);color:var(--primary)}
.wd.on b,.wd.today b{color:var(--primary);font-weight:600}
.wd i{display:block;width:5px;height:5px;border-radius:50%;background:var(--primary);margin:3px auto 0;opacity:0}
.wd.has i{opacity:1}

/* 응원 카드(진행률) */
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--primary-soft),var(--primary-soft-end));border-radius:var(--r-md);padding:16px;margin-bottom:24px;color:var(--ink)}
.hero .tx{flex:1;min-width:0}
.hero h3{font-size:18px;margin:0 0 2px}
.hero .meta2{font-size:12px}
.hero .pbar{margin:10px 0 8px;background:rgba(255,255,255,.45)}
.hero .pbar i{background:#fff}
.hero .lnk{border:0;background:#fff;color:var(--primary);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600}
.pbar{height:8px;border-radius:99px;overflow:hidden;background:var(--field)}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.prog-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.prog-top h3{margin:0}
.brief{margin:0 0 8px;line-height:1.7}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--field);border-radius:var(--r-md);padding:16px 8px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:500;line-height:1.2}
.stat span{color:var(--ink2);font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cal-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}

/* 입력·버튼 */
input,select,textarea{font-family:inherit;font-size:14px;padding:11px 12px;border:0;border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink2)}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--primary)}
textarea{width:100%;min-height:130px;resize:vertical}
input[type=radio],input[type=checkbox].plain{accent-color:var(--primary);width:18px;height:18px;padding:0}
.btn{background:var(--primary);color:#fff;border:0;height:40px;padding:0 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--field);color:var(--primary)}
.btn.del{background:var(--field);color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row .grow{flex:1;min-width:140px}
.row.act .btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:0;background:var(--field);color:var(--ink2);border-radius:var(--r-sm);padding:7px 14px;font-size:13px;font-weight:500}
.chip.on{background:var(--sel);color:var(--primary);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--primary)}
.tag{display:inline-block;background:rgba(255,255,255,.65);color:var(--ink);border-radius:99px;padding:1px 10px;font-size:11px;font-weight:500}
.meta{color:var(--ink2);font-size:12px}

/* 메모: 감정 타일처럼 탁한 파스텔 + 잘려 나오는 캐릭터 */
.memos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.memo{position:relative;overflow:hidden;border-radius:var(--r-md);padding:12px;min-height:178px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.memo .top2{display:flex;justify-content:space-between;align-items:center}
.memo h3{font-size:15px;margin:0}
.memo p{margin:0;font-size:13px;color:#333;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memo .chwrap{position:absolute;left:-10px;bottom:-14px;pointer-events:none}
.memo .bt{margin-top:auto;display:flex;gap:6px;justify-content:flex-end;position:relative;padding-top:6px}
.memo .btn.ghost,.memo .btn.del{background:rgba(255,255,255,.7)}
.pin{border:0;background:rgba(255,255,255,.65);border-radius:50%;width:28px;height:28px;font-size:13px}

/* 할 일: 습관 카드처럼 그라데이션 + 오른쪽 흰 원 */
.hab{display:flex;align-items:center;gap:8px;border-radius:var(--r-md);padding:12px 16px;margin-bottom:12px;color:var(--ink)}
.hab.pr-h{background:linear-gradient(90deg,#f08aaf,#d95584)}
.hab.pr-m{background:linear-gradient(90deg,#f8a11c,#f87723)}
.hab.pr-l{background:linear-gradient(90deg,#32c1bd,#24aba7)}
.hab .cap{font-size:11px}
.hab .tt{font-size:15px;font-weight:500}
.hab.done{opacity:.6}
.hab.done .tt{text-decoration:line-through}
.hab .x{color:var(--ink);opacity:.6}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:0;background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.chk:checked::after{content:"✓";color:var(--ink);font-size:14px;font-weight:700}
.chk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dd.over{background:rgba(255,255,255,.88);color:var(--danger);font-weight:600;border-radius:6px;padding:0 6px}

/* 일정·메모 줄 */
.rowc{display:flex;align-items:center;gap:12px;background:var(--field);border-radius:var(--r-md);padding:12px;margin-bottom:8px}
.rowc .tag{background:var(--surface)}
.grow{flex:1;min-width:0}
.tt{overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--ink2);font-size:18px;width:28px;height:28px;border-radius:50%;padding:0}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.empty-msg{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:14px;padding:4px 0 12px}

/* 캘린더 */
.card.calbox{background:var(--field);border-radius:var(--r-md);padding:16px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:6px}
.calhead h3{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;color:var(--ink2);font-size:11px}
.day{aspect-ratio:1;border:0;background:transparent;border-radius:var(--r-md);padding:4px;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink)}
.day:hover{background:var(--sel)}
.day.empty{pointer-events:none}
.day.today{color:var(--primary);font-weight:600}
.day.sel{background:var(--sel);color:var(--primary);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--primary)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.dot{width:6px;height:6px;border-radius:50%}
.dot.dl{border-radius:2px;background:var(--coral)}

/* 팝업·떠 있는 버튼·하단 탭바 */
.modal{position:fixed;inset:0;background:rgba(17,17,17,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:var(--r-md);padding:24px;width:100%;max-width:480px}
.modal input.t{width:100%;margin-bottom:12px}
.fab{position:fixed;right:max(24px,calc(50vw - 456px));bottom:84px;background:var(--primary);color:#fff;border:0;border-radius:var(--r-md);padding:12px 18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;z-index:8}
.fab span{font-size:20px;line-height:1;font-weight:400}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--field);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:9}
.tabbar button{border:0;background:transparent;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:400;padding:4px 0;flex:1}
.tabbar button.on{color:var(--primary);font-weight:600}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* 설정 목록: 글자 + 오른쪽 보라 꺾쇠, 구분선 없음 */
footer{max-width:960px;margin:0 auto;padding:0 24px 32px}
.set .cap{font-size:12px;color:var(--ink2);margin-bottom:4px}
.set button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:9px 0;font-size:14px;color:var(--ink);text-align:left}
.set button b{color:var(--primary);font-weight:500;font-size:18px}

@media(min-width:701px){
  .tabbar{display:none}
  .fab{bottom:32px}
  body{padding-bottom:100px}
}
@media(max-width:700px){
  .tabs{display:none}
  .cols,.cal-wrap{grid-template-columns:1fr}
  .memos{grid-template-columns:repeat(2,1fr)}
  .grid3{gap:8px} .stat b{font-size:22px}
}
</style>
</head>
<body>
<header><div class="top">
  <div class="logo"><span id="logoch"></span>하루결<small>메모 · 할 일 · 캘린더</small></div>
  <div class="tabs" id="nav"></div>
</div></header>
<main id="view"></main>
<footer><div class="set">
  <div class="cap">데이터</div>
  <button onclick="exportData()">내보내기<b>›</b></button>
  <button onclick="document.getElementById('imp').click()">가져오기<b>›</b></button>
  <button onclick="resetData()">예시 데이터로 초기화<b>›</b></button>
  <button onclick="blankData()">빈 화면으로 시작<b>›</b></button>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(this)">
</div></footer>
<button class="fab" id="fab" onclick="fabClick()"><span>+</span><b id="fabT" style="font-weight:500">할 일 추가</b></button>
<div class="tabbar" id="tabbar"></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle">메모</h3><br>
  <input class="t" id="mT" placeholder="제목" maxlength="60">
  <textarea id="mC" placeholder="내용"></textarea>
  <div class="row" style="margin-top:12px">
    <select id="mTag"></select>
    <label><input type="checkbox" id="mPin" class="plain"> 📌 상단 고정</label>
  </div>
  <div class="row act" style="margin:0">
    <button class="btn ghost" onclick="closeModal()">취소</button>
    <button class="btn" onclick="saveMemo()">저장</button>
  </div>
</div></div>

<div class="modal" id="em"><div class="box">
  <h3 id="eTitle">수정</h3><br>
  <input class="t" id="eT" maxlength="80" placeholder="내용">
  <div class="row"><input type="date" id="eD"></div>
  <div class="row" id="eRowP"><select id="eP"><option value="h">우선순위 높음</option><option value="m">우선순위 보통</option><option value="l">우선순위 낮음</option></select></div>
  <div class="row" id="eRowE">
    <select id="eC"><option value="0">분홍</option><option value="1">노랑</option><option value="2">청록</option><option value="3">파랑</option></select>
    <select id="eR"><option value="none">반복 안 함</option><option value="weekly">매주 반복</option><option value="monthly">매월 반복</option></select>
  </div>
  <div class="row act" style="margin:0">
    <button class="btn ghost" onclick="closeEdit()">취소</button>
    <button class="btn" onclick="saveEdit()">저장</button>
  </div>
</div></div>

<script>
/* ============ 1. 데이터 저장 (localStorage) ============ */
const TAGS=['업무','공부','아이디어','기타'];
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const KEY={m:'hg_memos',t:'hg_todos',e:'hg_events'};
let memos=[],todos=[],events=[];

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function parse(k){return new Date(k+'T00:00:00')}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){try{
  localStorage.setItem(KEY.m,JSON.stringify(memos));
  localStorage.setItem(KEY.t,JSON.stringify(todos));
  localStorage.setItem(KEY.e,JSON.stringify(events));
}catch(e){}}

function sample(){
  const now=Date.now();
  memos=[
    {id:uid(),title:'하루결 소개',content:'메모, 할 일, 캘린더를 한 화면에서 관리하는 웹 메모장입니다.\n자유롭게 써 보고 새로고침해도 남아 있는지 확인해 보세요.',tag:'기타',pinned:true,created:now},
    {id:uid(),title:'면접 준비 체크',content:'1분 자기소개 다듬기\n지원 회사 서비스 써 보기',tag:'업무',pinned:false,created:now-3600e3},
    {id:uid(),title:'스터디 정리',content:'오늘 배운 내용: 웹페이지는 HTML, CSS, JS로 만든다.',tag:'공부',pinned:false,created:now-86400e3},
    {id:uid(),title:'앱 아이디어',content:'하루 한 줄 회고 앱',tag:'아이디어',pinned:false,created:now-2*86400e3}
  ];
  todos=[
    {id:uid(),text:'포트폴리오 문장 다듬기',due:addDays(0),pri:'h',done:false},
    {id:uid(),text:'스터디 자료 읽기',due:addDays(2),pri:'m',done:false},
    {id:uid(),text:'이력서 파일 정리',due:addDays(-1),pri:'m',done:true},
    {id:uid(),text:'책상 정리',due:'',pri:'l',done:true},
    {id:uid(),text:'기업 설명회 신청하기',due:addDays(1),pri:'h',done:false}
  ];
  events=[
    {id:uid(),title:'부트캠프 수업',date:addDays(0),color:0},
    {id:uid(),title:'스터디 모임',date:addDays(3),color:2},
    {id:uid(),title:'기업 설명회',date:addDays(7),color:1}
  ];
  save();
}
function init(){
  const m=load(KEY.m),t=load(KEY.t),e=load(KEY.e);
  if(m&&t&&e){memos=m;todos=t;events=e}else sample();
}
function resetData(){
  if(confirm('모든 데이터가 예시 데이터로 바뀝니다. 계속할까요?')){sample();render()}
}

/* ============ 2. 도형 캐릭터 (표정 있는 도형: 색마다 한 친구) ============ */
const CH={
  circle:{c:'#f9a81b',s:'<circle cx="50" cy="52" r="42"/>',fy:0},
  pentagon:{c:'#f28eb4',s:'<polygon points="50,8 92,39 76,90 24,90 8,39" stroke="#f28eb4" stroke-width="8" stroke-linejoin="round"/>',fy:2},
  diamond:{c:'#7291d1',s:'<polygon points="50,6 94,50 50,94 6,50" stroke="#7291d1" stroke-width="8" stroke-linejoin="round"/>',fy:0},
  dome:{c:'#37c6c2',s:'<path d="M6 84 A44 44 0 0 1 94 84 Z" stroke="#37c6c2" stroke-width="6" stroke-linejoin="round"/>',fy:14},
  triangle:{c:'#f37350',s:'<polygon points="50,10 92,88 8,88" stroke="#f37350" stroke-width="8" stroke-linejoin="round"/>',fy:14}
};
function char(k,size=40){
  const h=CH[k]||CH.circle,y=50+h.fy;
  return `<svg class="chr" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${h.c}">${h.s}</g><circle cx="38" cy="${y}" r="4.5" fill="#111"/><circle cx="62" cy="${y}" r="4.5" fill="#111"/><path d="M42 ${y+13} Q50 ${y+21} 58 ${y+13}" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
const TAGC={'업무':'#bcc7dd','공부':'#adced7','아이디어':'#ddcea5','기타':'#dfc5d2'};   /* 탁한 파스텔 */
const TAGCH={'업무':'diamond','공부':'dome','아이디어':'circle','기타':'pentagon'};
function empty(text,kind='pentagon'){return `<div class="empty-msg">${char(kind,32)}<span>${text}</span></div>`}

/* ============ 3. 화면 상태·이동 ============ */
let tab='home',memoQ='',memoTag='전체',todoFilter='전체',homeTab='전체';
let calY=new Date().getFullYear(),calM=new Date().getMonth(),selDate=ymd(new Date());
let editId=null;
const ICON={
  home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
  memo:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  todo:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>'
};
const TABS=[['home','홈'],['memo','메모'],['todo','할 일'],['cal','캘린더']];
const FAB={home:'할 일 추가',memo:'새 메모',todo:'할 일 추가',cal:'일정 추가'};

function go(t){tab=t;window.scrollTo(0,0);render()}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  document.getElementById('tabbar').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${ICON[k]}${l}</button>`).join('');
  document.getElementById('view').innerHTML={home:viewHome,memo:viewMemo,todo:viewTodo,cal:viewCal}[tab]();
  document.getElementById('fabT').textContent=FAB[tab];
}
function focusLater(id){setTimeout(()=>{const e=document.getElementById(id);if(e){e.focus();e.scrollIntoView({block:'center'})}},50)}
function fabClick(){
  if(tab==='memo'){openModal();return}
  if(tab==='cal'){focusLater('et');return}
  if(tab==='home')go('todo');
  focusLater('tx');
}

/* ============ 4. 공통 조각 ============ */
function ddayText(due){
  if(!due)return '';
  const diff=Math.round((parse(due)-parse(ymd(new Date())))/86400e3);
  if(diff<0)return `<span class="dd over">기한 지남 (${-diff}일)</span>`;
  return `<span class="dd">${diff===0?'D-day':'D-'+diff} · ${due}</span>`;
}
const PRI={h:['높음','pr-h'],m:['보통','pr-m'],l:['낮음','pr-l']};
function todoRow(t,withDel=true){
  return `<div class="hab ${PRI[t.pri][1]} ${t.done?'done':''}">
    <div class="grow"><div class="cap">우선순위 ${PRI[t.pri][0]} · ${ddayText(t.due)||'마감일 없음'}</div><div class="tt">${esc(t.text)}</div></div>
    ${withDel?`<button class="x" aria-label="수정" onclick="openEdit('todo','${t.id}')">✎</button><button class="x" aria-label="삭제" onclick="delTodo('${t.id}')">×</button>`:''}
    <input type="checkbox" class="chk" aria-label="완료" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')">
  </div>`;
}
function stats(){
  const n=todos.length,d=todos.filter(t=>t.done).length;
  return {n,d,pct:n?Math.round(d/n*100):0};
}
function memoCard(m){
  return `<div class="memo" style="background:${TAGC[m.tag]||TAGC['기타']}">
    <div class="top2">
      <button class="pin" aria-label="고정" onclick="pinMemo('${m.id}')">${m.pinned?'📌':'📍'}</button>
      <span class="tag">${esc(m.tag)}</span>
    </div>
    <h3>${esc(m.title||'(제목 없음)')}</h3>
    <p>${esc(m.content)}</p>
    <div class="meta">${ymd(new Date(m.created))}</div>
    <span class="chwrap">${char(TAGCH[m.tag]||'pentagon',64)}</span>
    <div class="bt">
      <button class="btn ghost sm" onclick="openModal('${m.id}')">수정</button>
      <button class="btn del sm" onclick="delMemo('${m.id}')">삭제</button>
    </div>
  </div>`;
}
/* 반복 일정: 처음 날짜(e.date) 이후, 매주(7일 간격)·매월(같은 일) 규칙에 맞으면 그날 일정으로 본다 */
function occurs(e,d){
  if(d<e.date)return false;
  if(d===e.date)return true;
  if(e.repeat==='weekly')return Math.round((parse(d)-parse(e.date))/86400e3)%7===0;
  if(e.repeat==='monthly')return d.slice(8)===e.date.slice(8);
  return false;
}
function eventsOn(d){return events.filter(e=>occurs(e,d))}
function monthEventCount(ym){
  const [y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate();let c=0;
  for(let i=1;i<=n;i++)c+=eventsOn(ym+'-'+pad(i)).length;
  return c;
}
function todosOn(d){return todos.filter(t=>t.due===d)}
function memosOn(d){return memos.filter(m=>ymd(new Date(m.created))===d)}
function eventRow(e,withDel){
  return `<div class="rowc"><span class="sw" style="background:${COLORS[e.color]};width:12px;height:12px"></span>
    <div class="grow"><div class="tt">${esc(e.title)}</div><div class="sub">${e.repeat==='weekly'?'🔁 매주 반복':e.repeat==='monthly'?'🔁 매월 반복':'일정'}</div></div>
    ${withDel?`<button class="x" aria-label="수정" onclick="openEdit('event','${e.id}')">✎</button><button class="x" aria-label="삭제" onclick="delEvent('${e.id}')">×</button>`:''}</div>`;
}
function memoRow(m){
  return `<div class="rowc"><span class="tag" style="background:${TAGC[m.tag]||TAGC['기타']}">${esc(m.tag)}</span>
    <div class="grow"><div class="tt">${esc(m.title||'(제목 없음)')}</div></div></div>`;
}

/* ============ 5. 홈 ============ */
function weekDays(){
  const d=parse(selDate),dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ymd(x)});
}
function shiftWeek(n){const d=parse(selDate);d.setDate(d.getDate()+n*7);pickDay(ymd(d))}
function pickDay(k){selDate=k;const d=parse(k);calY=d.getFullYear();calM=d.getMonth();render()}

/* 응원 카드: 진행 상황에 따라 말투가 바뀝니다 */
function cheer(s){
  if(!s.n)return '할 일을 추가하고 시작해 볼까요?';
  if(s.pct===0)return '오늘 하나만 해 볼까요?';
  if(s.pct<50)return '좋은 출발이에요!';
  if(s.pct<100)return '아주 잘하고 있어요!';
  return '모두 해냈어요! 정말 대단해요';
}
function progressCard(s,link=false){
  return `<div class="hero">${char('circle',64)}
    <div class="tx"><h3>${cheer(s)}</h3>
      <div class="meta2">${s.n}개 중 ${s.d}개 완료 · ${s.pct}%</div>
      <div class="pbar"><i style="width:${s.pct}%"></i></div>
      ${link?'<button class="lnk" onclick="go(\'todo\')">할 일 보기 ›</button>':''}
    </div></div>`;
}

function viewHome(){
  const today=ymd(new Date()),days=weekDays(),d=parse(selDate),s=stats();
  const names=['월','화','수','목','금','토','일'];
  const ym=today.slice(0,7);
  const ev=eventsOn(selDate),td=todosOn(selDate),ms=memosOn(selDate);
  let rows='';
  if(homeTab==='전체'||homeTab==='일정')rows+=ev.map(e=>eventRow(e,false)).join('');
  if(homeTab==='전체'||homeTab==='할 일')rows+=td.map(t=>todoRow(t,false)).join('');
  if(homeTab==='전체'||homeTab==='메모')rows+=ms.map(memoRow).join('');
  const recent=[...memos].sort((a,b)=>b.created-a.created).slice(0,3);
  return `
  <div class="weekbar">
    <div class="weekhead">
      <h2>${d.getFullYear()}.${pad(d.getMonth()+1)}</h2>
      <span><button class="arrow" aria-label="이전 주" onclick="shiftWeek(-1)">‹</button>
      <button class="arrow" aria-label="다음 주" onclick="shiftWeek(1)">›</button></span>
    </div>
    <div class="week">${days.map((k,i)=>{
      const has=eventsOn(k).length+todosOn(k).length>0;
      return `<button class="wd ${k===selDate?'on':''} ${k===today?'today':''} ${has?'has':''}" onclick="pickDay('${k}')">${names[i]}<b>${parseInt(k.slice(8))}</b><i></i></button>`}).join('')}</div>
  </div>
  ${progressCard(s,true)}
  ${briefCard()}
  <div class="grid3">
    <div class="stat"><b>${memos.length}</b><span>전체 메모</span></div>
    <div class="stat"><b>${todos.filter(t=>!t.done).length}</b><span>남은 할 일</span></div>
    <div class="stat"><b>${monthEventCount(ym)}</b><span>이번 달 일정</span></div>
  </div>
  <div class="card">
    <h3>${selDate===today?'오늘':selDate}의 하루</h3>
    <div class="chips">${['전체','일정','할 일','메모'].map(t=>`<button class="chip ${t===homeTab?'on':''}" onclick="homeTab='${t}';render()">${t}</button>`).join('')}</div>
    ${rows||empty('이 날은 비어 있어요. 아래 + 버튼으로 추가해 보세요.','dome')}
  </div>
  <div class="card"><h3>최근 메모</h3>${recent.length?`<div class="memos">${recent.map(memoCard).join('')}</div>`:empty('메모가 없어요.','diamond')}</div>`;
}

/* ===== 오늘의 브리핑 =====
   BRIEF_URL이 비어 있으면 AI 없이 만든 기본 요약을 보여주고,
   중간 서버 주소(server/설치방법.md 참고)를 넣으면 AI 요약으로 바뀝니다. */
const BRIEF_URL='';
let brief={text:'',src:'',loading:false,err:''};
function briefData(){
  const k=ymd(new Date());
  return {
    date:k,
    events:eventsOn(k).map(e=>e.title),
    todos:todosOn(k).map(t=>({text:t.text,due:t.due,done:t.done})),
    memos:[...memos].sort((a,b)=>b.created-a.created).slice(0,5).map(m=>m.title||'(제목 없음)')
  };
}
function localBrief(d){
  const open=d.todos.filter(t=>!t.done);
  let s=`오늘은 일정 ${d.events.length}개${d.events.length?`(${d.events.slice(0,3).join(', ')})`:''}, 마감 할 일 ${d.todos.length}개가 있어요.`;
  if(d.todos.length)s+=` 아직 남은 마감은 ${open.length}개${open.length?`: ${open.slice(0,3).map(t=>t.text).join(', ')}`:''}예요.`;
  if(d.memos.length)s+=` 가장 최근 메모는 "${d.memos[0]}"이에요.`;
  return s;
}
async function makeBrief(){
  const d=briefData();
  if(!BRIEF_URL){brief={text:localBrief(d),src:'local',loading:false,err:''};render();return}
  brief={text:brief.text,src:brief.src,loading:true,err:''};render();
  try{
    const r=await fetch(BRIEF_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    const j=await r.json();
    if(!r.ok||!j.text)throw new Error(j.error||'실패');
    brief={text:j.text,src:'ai',loading:false,err:''};
  }catch(e){
    brief={text:localBrief(d),src:'local',loading:false,err:'AI 요약을 불러오지 못해 기본 요약을 보여드려요.'};
  }
  render();
}
function hideBrief(){brief={text:'',src:'',loading:false,err:''};render()}
function briefCard(){
  const note=brief.src==='ai'?'AI가 만든 요약이에요. 틀릴 수 있어요. 저장되지 않아요.':'AI 없이 만든 기본 요약이에요.';
  return `<div class="card">
    <div class="prog-top"><h3>오늘의 브리핑</h3><span>
      <button class="btn ghost sm" onclick="makeBrief()" ${brief.loading?'disabled':''}>${brief.loading?'만드는 중…':brief.text?'다시 만들기':'브리핑 만들기'}</button>
      ${brief.text?'<button class="btn ghost sm" onclick="hideBrief()">숨기기</button>':''}
    </span></div>
    ${brief.text?`<p class="brief">${esc(brief.text)}</p><div class="sub">${note}${brief.err?' '+esc(brief.err):''}</div>`
      :empty('버튼을 누르면 오늘 일정·마감 할 일·최근 메모를 한눈에 정리해 줘요.','triangle')}
    ${BRIEF_URL?'<div class="sub" style="margin-top:6px">AI 요약을 만들 때 오늘 일정·마감 할 일·최근 메모 제목이 AI 서비스로 전송돼요. 주민번호·계좌번호·비밀번호는 적지 마세요.</div>':''}
  </div>`;
}

/* ============ 6. 메모 ============ */
function viewMemo(){
  let list=memos.filter(m=>(memoTag==='전체'||m.tag===memoTag)&&
    (!memoQ||(m.title+' '+m.content).toLowerCase().includes(memoQ.toLowerCase())));
  list.sort((a,b)=>(b.pinned-a.pinned)||(b.created-a.created));
  return `
  <div class="row"><input class="grow" id="q" placeholder="제목·내용 검색" value="${esc(memoQ)}" oninput="memoQ=this.value;renderKeep('q')"></div>
  <div class="chips">${['전체',...TAGS].map(t=>`<button class="chip ${t===memoTag?'on':''}" onclick="memoTag='${t}';render()">${t}</button>`).join('')}</div>
  ${list.length?`<div class="memos">${list.map(memoCard).join('')}</div>`:empty('보여줄 메모가 없어요.','pentagon')}`;
}
/* 검색창에 글자를 칠 때 포커스가 사라지지 않게 */
function renderKeep(id){
  render();
  const el=document.getElementById(id);
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
function openModal(id=null){
  editId=id;
  const m=memos.find(x=>x.id===id)||{title:'',content:'',tag:TAGS[0],pinned:false};
  document.getElementById('mTitle').textContent=id?'메모 수정':'새 메모';
  document.getElementById('mT').value=m.title;
  document.getElementById('mC').value=m.content;
  document.getElementById('mTag').innerHTML=TAGS.map(t=>`<option ${t===m.tag?'selected':''}>${t}</option>`).join('');
  document.getElementById('mPin').checked=m.pinned;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveMemo(){
  const title=document.getElementById('mT').value.trim(),content=document.getElementById('mC').value.trim();
  if(!title&&!content){alert('제목이나 내용을 입력해 주세요.');return}
  const data={title,content,tag:document.getElementById('mTag').value,pinned:document.getElementById('mPin').checked};
  if(editId)Object.assign(memos.find(x=>x.id===editId),data);
  else memos.push({id:uid(),created:Date.now(),...data});
  save();closeModal();render();
}
function delMemo(id){if(confirm('이 메모를 삭제할까요? 되돌릴 수 없어요.')){memos=memos.filter(m=>m.id!==id);save();render()}}
function pinMemo(id){const m=memos.find(x=>x.id===id);m.pinned=!m.pinned;save();render()}

/* ============ 7. 할 일 ============ */
function viewTodo(){
  const s=stats();
  const list=todos.filter(t=>todoFilter==='전체'||(todoFilter==='진행 중'?!t.done:t.done));
  return `
  ${progressCard(s)}
  <div class="card">
    <div class="row">
      <input class="grow" id="tx" placeholder="할 일 입력" maxlength="80" onkeydown="if(event.key==='Enter')addTodo()">
      <input type="date" id="td">
      <select id="tp"><option value="h">높음</option><option value="m" selected>보통</option><option value="l">낮음</option></select>
      <button class="btn" onclick="addTodo()">추가</button>
    </div>
    <div class="chips">${['전체','진행 중','완료'].map(f=>`<button class="chip ${f===todoFilter?'on':''}" onclick="todoFilter='${f}';render()">${f}</button>`).join('')}</div>
    ${list.length?list.map(t=>todoRow(t)).join(''):empty('할 일이 없어요.','circle')}
  </div>`;
}
function addTodo(){
  const text=document.getElementById('tx').value.trim();
  if(!text){alert('할 일을 입력해 주세요.');return}
  todos.push({id:uid(),text,due:document.getElementById('td').value,pri:document.getElementById('tp').value,done:false});
  save();render();
}
function toggleTodo(id){const t=todos.find(x=>x.id===id);t.done=!t.done;save();render()}
function delTodo(id){todos=todos.filter(t=>t.id!==id);save();render()}

/* ============ 8. 캘린더 ============ */
function viewCal(){
  const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate(),today=ymd(new Date());
  let cells=['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first.getDay();i++)cells+='<div class="day empty"></div>';
  for(let d=1;d<=days;d++){
    const key=calY+'-'+pad(calM+1)+'-'+pad(d);
    const dots=eventsOn(key).map(e=>`<i class="dot" style="background:${COLORS[e.color]}"></i>`).join('')
      +todosOn(key).map(()=>'<i class="dot dl"></i>').join('');
    cells+=`<button class="day ${key===today?'today':''} ${key===selDate?'sel':''}" onclick="selDate='${key}';render()">${d}<span class="dots">${dots}</span></button>`;
  }
  const ev=eventsOn(selDate),tds=todosOn(selDate),ms=memosOn(selDate);
  return `<div class="cal-wrap">
  <div class="card calbox">
    <div class="calhead">
      <button class="arrow" aria-label="이전 달" onclick="moveMonth(-1)">‹</button>
      <h3 style="margin:0">${calY}년 ${calM+1}월</h3>
      <span><button class="btn ghost sm" onclick="goToday()">오늘</button>
      <button class="arrow" aria-label="다음 달" onclick="moveMonth(1)">›</button></span>
    </div>
    <div class="cal">${cells}</div>
    <div class="sub" style="margin-top:12px">● 일정 &nbsp; <span style="color:var(--coral)">■</span> 할 일 마감</div>
  </div>
  <div class="card">
    <h3>${selDate}</h3>
    <div class="row">
      <input class="grow" id="et" placeholder="일정 제목" maxlength="40" onkeydown="if(event.key==='Enter')addEvent()">
      <select id="er"><option value="none">반복 안 함</option><option value="weekly">매주 반복</option><option value="monthly">매월 반복</option></select>
      <button class="btn sm" onclick="addEvent()">일정 추가</button>
    </div>
    <div class="row">${COLORS.map((c,i)=>`<label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer"><input type="radio" name="ec" value="${i}" ${i===0?'checked':''}><span class="sw" style="width:14px;height:14px;background:${c}"></span></label>`).join('')}</div>
    <h3 style="font-size:14px;color:var(--ink2)">일정</h3>
    ${ev.length?ev.map(e=>eventRow(e,true)).join(''):empty('일정 없음','dome')}
    <h3 style="font-size:14px;color:var(--ink2);margin-top:12px">마감 할 일</h3>
    ${tds.length?tds.map(t=>todoRow(t,false)).join(''):empty('마감 할 일 없음','circle')}
    <h3 style="font-size:14px;color:var(--ink2);margin-top:12px">이날 쓴 메모</h3>
    ${ms.length?ms.map(memoRow).join(''):empty('메모 없음','diamond')}
  </div></div>`;
}
function moveMonth(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render()}
function goToday(){const d=new Date();calY=d.getFullYear();calM=d.getMonth();selDate=ymd(d);render()}
function addEvent(){
  const title=document.getElementById('et').value.trim();
  if(!title){alert('일정 제목을 입력해 주세요.');return}
  events.push({id:uid(),title,date:selDate,color:+document.querySelector('input[name=ec]:checked').value,repeat:document.getElementById('er').value});
  save();render();
}
function delEvent(id){
  const e=events.find(x=>x.id===id);
  if(e&&e.repeat&&e.repeat!=='none'&&!confirm('반복 일정 전체가 삭제됩니다. 계속할까요?'))return;
  events=events.filter(e=>e.id!==id);save();render();
}

/* ============ 9. 수정 팝업 (할 일·일정 공용) ============ */
let editKind=null,editKey=null;
const $=id=>document.getElementById(id);
function openEdit(kind,id){
  const isT=kind==='todo',it=(isT?todos:events).find(x=>x.id===id);
  if(!it)return;
  editKind=kind;editKey=id;
  $('eTitle').textContent=isT?'할 일 수정':'일정 수정';
  $('eT').value=isT?it.text:it.title;
  $('eD').value=isT?(it.due||''):it.date;
  $('eRowP').style.display=isT?'flex':'none';
  $('eRowE').style.display=isT?'none':'flex';
  if(isT)$('eP').value=it.pri;else{$('eC').value=it.color;$('eR').value=it.repeat||'none'}
  $('em').classList.add('open');
}
function closeEdit(){$('em').classList.remove('open')}
function saveEdit(){
  const text=$('eT').value.trim(),date=$('eD').value;
  if(!text){alert('내용을 입력해 주세요.');return}
  if(editKind==='todo'){
    const t=todos.find(x=>x.id===editKey);
    t.text=text;t.due=date;t.pri=$('eP').value;
  }else{
    if(!date){alert('날짜를 선택해 주세요.');return}
    const e=events.find(x=>x.id===editKey);
    e.title=text;e.date=date;e.color=+$('eC').value;e.repeat=$('eR').value;
  }
  save();closeEdit();render();
}

/* ============ 10. 내보내기 · 가져오기 · 빈 화면 시작 ============ */
function exportData(){
  const json=JSON.stringify({app:'haru-gyeol',version:1,memos,todos,events},null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download='haru-gyeol-backup-'+ymd(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
function importData(input){
  const f=input.files[0];input.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let d;
    try{
      d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.memos)||!Array.isArray(d.todos)||!Array.isArray(d.events))throw 0;
    }catch(e){alert('올바른 하루결 백업 파일이 아니에요.');return}
    if(!confirm(`메모 ${d.memos.length}개, 할 일 ${d.todos.length}개, 일정 ${d.events.length}개를 가져옵니다. 지금 데이터는 덮어써져요. 계속할까요?`))return;
    const obj=x=>x&&typeof x==='object';
    memos=d.memos.filter(obj).map(m=>({id:String(m.id||uid()),title:String(m.title||''),content:String(m.content||''),tag:TAGS.includes(m.tag)?m.tag:'기타',pinned:!!m.pinned,created:Number(m.created)||Date.now()}));
    todos=d.todos.filter(obj).map(t=>({id:String(t.id||uid()),text:String(t.text||''),due:isDate(t.due)?t.due:'',pri:['h','m','l'].includes(t.pri)?t.pri:'m',done:!!t.done}));
    events=d.events.filter(e=>obj(e)&&isDate(e.date)).map(e=>({id:String(e.id||uid()),title:String(e.title||''),date:e.date,color:[0,1,2,3].includes(+e.color)?+e.color:0,repeat:['weekly','monthly'].includes(e.repeat)?e.repeat:'none'}));
    save();render();
  };
  r.readAsText(f);
}
function blankData(){
  if(confirm('메모·할 일·일정이 모두 삭제되고 빈 화면이 됩니다. 되돌릴 수 없어요. (먼저 "내보내기"로 백업할 수 있어요) 계속할까요?')){
    memos=[];todos=[];events=[];save();render();
  }
}

document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('em').addEventListener('click',e=>{if(e.target.id==='em')closeEdit()});
document.getElementById('logoch').innerHTML=char('circle',26);
init();render();
</script>
